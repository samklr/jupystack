# Rendered by entrypoint.sh: envsubst replaces ${MINIO_ACCESS_KEY} / ${MINIO_SECRET_KEY}
# before this file is moved into $SPARK_HOME/conf/spark-defaults.conf.

# ---- S3A → MinIO ----
spark.hadoop.fs.s3a.endpoint                     http://minio:9000
spark.hadoop.fs.s3a.access.key                   ${MINIO_ACCESS_KEY}
spark.hadoop.fs.s3a.secret.key                   ${MINIO_SECRET_KEY}
spark.hadoop.fs.s3a.path.style.access            true
spark.hadoop.fs.s3a.impl                         org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.aws.credentials.provider     org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider
spark.hadoop.fs.s3a.connection.ssl.enabled       false

# ---- Delta Lake ----
spark.sql.extensions                             io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog                  org.apache.spark.sql.delta.catalog.DeltaCatalog

# ---- Iceberg (REST catalog backed by MinIO) ----
spark.sql.catalog.iceberg                        org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.iceberg.type                   rest
spark.sql.catalog.iceberg.uri                    http://iceberg-rest:8181
spark.sql.catalog.iceberg.warehouse              s3a://spark-warehouse/iceberg
# HadoopFileIO uses the S3A connector (same as Delta). S3FileIO via AWS SDK v2
# has native components that crash with SIGABRT on Apple Silicon under load.
spark.sql.catalog.iceberg.io-impl                org.apache.iceberg.hadoop.HadoopFileIO

# Iceberg's vectorized Arrow Parquet reader crashes the JIT compiler on
# aarch64 + JDK 17 (SIGSEGV in CompileBroker::compile_method). Disabling
# vectorization makes reads slower but stable.
spark.sql.iceberg.vectorization.enabled          false

# ---- History Server (event logs on MinIO) ----
spark.eventLog.enabled                           true
spark.eventLog.dir                               s3a://spark-logs/events
spark.history.fs.logDirectory                    s3a://spark-logs/events

# ---- Misc ----
spark.serializer                                 org.apache.spark.serializer.KryoSerializer
spark.sql.adaptive.enabled                       true

# Bigger executor heap — medallion ETL needs more room than the 1 GiB default.
spark.executor.memory                            3g

# Use zstd instead of snappy for parquet compression.
# snappy-java JNI has a long history of SIGABRT on Apple Silicon under load;
# zstd's native binary is much more reliable on arm64.
spark.sql.parquet.compression.codec              zstd

# Smaller parquet row groups cap the native buffer footprint of column writers,
# which was crashing the executor with SIGABRT on Iceberg writes >50K rows.
spark.sql.parquet.row.group.size.bytes           16777216
spark.sql.files.maxPartitionBytes                33554432
