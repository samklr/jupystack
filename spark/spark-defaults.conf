# Rendered by entrypoint.sh: envsubst replaces ${MINIO_ACCESS_KEY} / ${MINIO_SECRET_KEY}
# before this file is moved into $SPARK_HOME/conf/spark-defaults.conf.

# ---- S3A → MinIO ----
spark.hadoop.fs.s3a.endpoint                     http://minio:9000
spark.hadoop.fs.s3a.access.key                   ${MINIO_ACCESS_KEY}
spark.hadoop.fs.s3a.secret.key                   ${MINIO_SECRET_KEY}
spark.hadoop.fs.s3a.path.style.access            true
spark.hadoop.fs.s3a.impl                         org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.aws.credentials.provider     org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider
spark.hadoop.fs.s3a.connection.ssl.enabled       false

# ---- Delta Lake ----
spark.sql.extensions                             io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog                  org.apache.spark.sql.delta.catalog.DeltaCatalog

# ---- Iceberg (REST catalog backed by MinIO) ----
spark.sql.catalog.iceberg                        org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.iceberg.type                   rest
spark.sql.catalog.iceberg.uri                    http://iceberg-rest:8181
spark.sql.catalog.iceberg.warehouse              s3a://spark-warehouse/iceberg
spark.sql.catalog.iceberg.io-impl                org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.iceberg.s3.endpoint            http://minio:9000
spark.sql.catalog.iceberg.s3.path-style-access   true
spark.sql.catalog.iceberg.s3.access-key-id       ${MINIO_ACCESS_KEY}
spark.sql.catalog.iceberg.s3.secret-access-key   ${MINIO_SECRET_KEY}
# AWS SDK v2 demands a region even when talking to MinIO — any valid value works.
spark.sql.catalog.iceberg.client.region          us-east-1
spark.sql.catalog.iceberg.s3.region              us-east-1

# ---- History Server (event logs on MinIO) ----
spark.eventLog.enabled                           true
spark.eventLog.dir                               s3a://spark-logs/events
spark.history.fs.logDirectory                    s3a://spark-logs/events

# ---- Misc ----
spark.serializer                                 org.apache.spark.serializer.KryoSerializer
spark.sql.adaptive.enabled                       true
